<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game AR - Gerak Kepala</title>
    <meta name="description" content="Game kuis edukasi interaktif berbasis Augmented Reality (AR) dengan deteksi gerakan kepala menggunakan kamera webcam. Mendukung mode 1 pemain dan 2 pemain (split screen), bank soal kustom, serta impor/ekspor Excel." />
    <meta property="og:title" content="Game AR - Gerak Kepala" />
    <meta property="og:description" content="Game kuis edukasi interaktif berbasis Augmented Reality (AR) dengan deteksi gerakan kepala menggunakan kamera webcam. Mendukung mode 1 pemain dan 2 pemain (split screen), bank soal kustom, serta impor/ekspor Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Script penanganan trailing slash di GitHub Pages agar path aset relatif tidak gagal (mencegah blank screen) -->
    <script>
      (function() {
        var l = window.location;
        // Jika path tidak berakhiran slash dan tidak memiliki ekstensi file, tambahkan trailing slash
        if (l.pathname && !l.pathname.endsWith('/') && !l.pathname.split('/').pop().includes('.')) {
          l.replace(l.protocol + '//' + l.host + l.pathname + '/' + l.search + l.hash);
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- MediaPipe scripts for FaceMesh and Camera (menggunakan defer agar tidak memblokir render React) -->
    <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  </head>
  <body class="bg-slate-950 text-white antialiased overflow-hidden select-none">
    <div id="root">
      <!-- Fallback visual loading indicator saat React sedang dimuat (mencegah blank screen putih) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #fff; font-family: 'Nunito', sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; font-weight: 700; color: #94a3b8; font-size: 15px; letter-spacing: 0.5px;">Memuat Game AR Gerak Kepala...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
