<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Game AR - Gerak Kepala</title>
    <meta name="description" content="Game kuis edukasi interaktif berbasis Augmented Reality (AR) dengan deteksi gerakan kepala menggunakan kamera webcam. Mendukung mode 1 pemain dan 2 pemain (split screen), bank soal kustom, serta impor/ekspor Excel." />
    <meta property="og:title" content="Game AR - Gerak Kepala" />
    <meta property="og:description" content="Game kuis edukasi interaktif berbasis Augmented Reality (AR) dengan deteksi gerakan kepala menggunakan kamera webcam. Mendukung mode 1 pemain dan 2 pemain (split screen), bank soal kustom, serta impor/ekspor Excel." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
      html, body {
        background-color: #020617;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
    
    <script>
      // Tangkap dan tampilkan kesalahan loading skrip atau runtime secara langsung
      window.__appErrors = [];
      window.addEventListener('error', function(event) {
        var msg = '';
        if (event.message) {
          msg = event.message + (event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : '');
        } else if (event.target && event.target.src) {
          msg = 'Gagal memuat berkas: ' + event.target.src;
        } else if (event.target && event.target.href) {
          msg = 'Gagal memuat stylesheet: ' + event.target.href;
        } else {
          msg = 'Terjadi kesalahan saat memuat modul aplikasi.';
        }
        window.__appErrors.push(msg);
        var errEl = document.getElementById('initial-error-log');
        var fb = document.getElementById('loading-fallback-btn');
        if (fb) fb.style.display = 'block';
        if (errEl) {
          errEl.style.display = 'block';
          errEl.textContent = 'Detail: ' + msg;
        }
      }, true);

      // Normalisasi trailing slash untuk GitHub Pages agar path relatif tidak 404
      if (location.hostname.includes('github.io') && location.pathname && !location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
  </head>
  <body class="bg-slate-950 text-white antialiased overflow-hidden select-none">
    <div id="root">
      <div id="initial-loading-spinner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background-color:#020617;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px;">
        <div style="width:48px;height:48px;border:4px solid rgba(56,189,248,0.2);border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px;"></div>
        <h2 style="font-size:22px;font-weight:bold;margin:0 0 8px 0;color:#38bdf8;font-family:'Fredoka One',cursive,sans-serif;">Game AR - Gerak Kepala</h2>
        <p style="font-size:14px;color:#94a3b8;margin:0;">Memuat antarmuka game...</p>
        
        <div id="initial-error-log" style="display:none;margin-top:16px;padding:12px 16px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);border-radius:12px;color:#fca5a5;font-size:12px;max-width:90%;margin-left:auto;margin-right:auto;word-break:break-word;text-align:left;font-family:monospace;"></div>

        <div id="loading-fallback-btn" style="display:none;margin-top:20px;">
          <p style="font-size:12px;color:#f87171;margin-bottom:8px;">Pemuatan memakan waktu lebih lama dari biasanya...</p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <button onclick="location.reload(true)" style="padding:10px 18px;background:#0284c7;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-size:13px;">Muat Ulang Halaman</button>
            <button onclick="localStorage.clear();location.reload(true)" style="padding:10px 18px;background:#334155;color:#fff;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-size:13px;">Hapus Cache &amp; Reset</button>
          </div>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
      <script>
        setTimeout(function() {
          var btn = document.getElementById('loading-fallback-btn');
          if (btn) btn.style.display = 'block';
        }, 2500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
