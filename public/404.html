<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengalihkan - Game AR Gerak Kepala</title>
    <script>
      // Otomatis mengarahkan ke halaman utama repository jika tersesat ke 404
      var pathname = window.location.pathname;
      var segments = pathname.split('/').filter(Boolean);
      var basePath = segments.length > 0 ? '/' + segments[0] + '/' : '/';
      window.location.replace(basePath);
    </script>
  </head>
  <body style="background:#020617;color:#ffffff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:system-ui,-apple-system,sans-serif;">
    <p>Mengalihkan ke halaman utama Game AR...</p>
  </body>
</html>
